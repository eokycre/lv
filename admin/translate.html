<!doctype html>
<html lang="lv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tulkojumi - ZELTAINS</title>
    <style>
        :root {
            color-scheme: dark;
            --blue: #191970;
            --gold: #ffd700;
            --ink: #f7f4e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--blue);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(980px, 100%);
            margin: 0 auto;
            padding: 28px 18px 60px;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--gold);
            font-size: clamp(30px, 6vw, 52px);
            font-weight: normal;
        }

        .intro,
        .status {
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .intro {
            margin: 0 0 28px;
        }

        .field {
            display: grid;
            gap: 7px;
            margin-top: 18px;
        }

        label,
        legend {
            color: var(--gold);
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
        }

        input,
        textarea,
        select,
        button {
            font: inherit;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--gold);
            border-radius: 3px;
            background: var(--blue);
            color: var(--ink);
            padding: 10px 11px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .targets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 9px 16px;
            margin: 12px 0 24px;
        }

        .target {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ink);
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: normal;
        }

        .target input {
            width: auto;
            accent-color: var(--gold);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 26px;
        }

        button {
            border: 0;
            background: transparent;
            color: var(--gold);
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 15px;
            padding: 8px 0;
        }

        button:hover,
        button:focus-visible {
            color: white;
        }

        button:disabled {
            cursor: wait;
            opacity: .5;
        }

        .results {
            display: grid;
            gap: 24px;
            margin-top: 34px;
        }

        .result {
            border-top: 1px solid rgba(255, 215, 0, .6);
            padding-top: 18px;
        }

        .result h2 {
            margin: 0;
            color: var(--gold);
            font-size: 25px;
            font-weight: normal;
        }

        .status {
            min-height: 24px;
            margin: 20px 0 0;
        }

        .error {
            color: #ffb4a8;
        }
    </style>
</head>
<body>
    <main>
        <h1>Rakstu tulkojumi</h1>
        <p class="intro">Ievadi tekstu latviski, izvēlies valodas un pārbaudi automātiskos tulkojumus.</p>

        <form id="translation-form">
            <div class="field">
                <label for="title">Virsraksts</label>
                <input id="title" name="title" required maxlength="1000">
            </div>

            <div class="field">
                <label for="excerpt">Īsais apraksts</label>
                <textarea id="excerpt" name="excerpt" required maxlength="5000"></textarea>
            </div>

            <div class="field">
                <label for="content">Pilnais raksta saturs</label>
                <textarea id="content" name="content" required maxlength="20000"></textarea>
            </div>

            <fieldset class="field">
                <legend>Tulkot uz</legend>
                <div id="targets" class="targets">
                    <p class="status">Ielādē DeepL valodas...</p>
                </div>
            </fieldset>

            <div class="actions">
                <button id="translate" type="submit">Ģenerēt tulkojumus ↵</button>
                <button id="clear" type="button">Notīrīt</button>
            </div>
            <p id="status" class="status" role="status"></p>
        </form>

        <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="translate.js"></script>
</body>
</html>
