<!DOCTYPE html>
<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZELTAINS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="navbar.js"
        defer
    ></script>

    <script
        src="https://identity.netlify.com/v1/netlify-identity-widget.js"
        defer
    ></script>

    <script
        src="js/cards.js"
        defer
    ></script>

</head>


<body>

    <main>

        <section class="hero-text">

            <p>Tu esi</p>

            <p>You are golden</p>

            <p>Tu es en or</p>

            <p>Sei d'oro</p>

        </section>


        <section
            class="raksti-container"
            data-category="all"
        ></section>

    </main>

<script>
    window.addEventListener(
        "load",
        function () {

            if (!window.netlifyIdentity) {
                return;
            }


            window.netlifyIdentity.on(
                "init",
                function () {

                    if (
                        /#(?:invite|recovery)_token=/.test(
                            window.location.hash
                        )
                    ) {
                        window.netlifyIdentity.open();
                    }

                }
            );

        }
    );
</script>

</body>

</html>
